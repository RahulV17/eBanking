spring:
  datasource:
    url: jdbc:${DB_URL}
    username: ${DB_UN}
    password: ${DB_PWD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  mail:
      host: smtp.gmail.com
      port: 587
      username: ${EMAIL}
      password: ${APP_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
              required: true
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: ${OPENROUTER_MODEL:nvidia/nemotron-3.5-lightning:free}
server:
  port: ${PORT}
jwt:
  secret: ${JWT_KEY}
razorpay:
  key: ${RZRPY_KEY}
  secret: ${RZRPY_SECRET}
logging:
  level:
    root: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql: INFO
    org.springframework.data.redis: INFO
    org.apache.catalina: INFO
    org.apache.coyote: INFO
    org.springframework.web: INFO